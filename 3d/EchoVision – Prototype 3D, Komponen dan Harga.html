<script>
const $=id=>document.getElementById(id),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),D=JSON.parse($('data').textContent),

const R=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});R.setPixelRatio(Math.min(devicePixelRatio,2));
const S=new THREE.Scene(),cam=new THREE.PerspectiveCamera(45,1,.05,60);

const env=new THREE.Group(),wm=(c,o)=>new THREE.MeshBasicMaterial(Object.assign({color:c,transparent:true,depthWrite:false,side:THREE.DoubleSide},o));

env.add(surf,col,bed);S.add(env);

// model dari JSON
function solarTex(){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d');g.fillStyle='#1b3a78';g.fillRect(0,0,128,128);g.strokeStyle='#8fb0e8';g.lineWidth=2;
 for(let i=0;i<=128;i+=21){g.beginPath();g.moveTo(i,0);g.lineTo(i,128);g.moveTo(0,i);g.lineTo(128,i);g.stroke()}return new THREE.CanvasTexture(c)}
const stex=solarTex(),groups={},comps={};
function build(p){const s=p.size;let geo;
 if(p.type=='cylinder')geo=new THREE.CylinderGeometry(s[0],s[0],s[1],28);
 else if(p.type=='box')geo=new THREE.BoxGeometry(...s);
 else if(p.type=='sphere')geo=new THREE.SphereGeometry(s[0],32,16);
 else if(p.type=='torus')geo=new THREE.TorusGeometry(s[0],s[1],10,40);
 else if(p.type=='tube')geo=new THREE.TubeGeometry(new THREE.CatmullRomCurve3(p.points.map(V)),40,s[0],6);
 else{const A=V(p.from),B=V(p.to);geo=new THREE.CylinderGeometry(s[0],s[0],A.distanceTo(B),10)}
 const op=p.opacity==null?1:p.opacity,m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:p.texture?0xffffff:p.color,map:p.texture?stex:null,roughness:.5,metalness:p.metal||0,transparent:op<1,opacity:op,depthWrite:op>=1}));
 if(p.type=='rod'){const A=V(p.from),B=V(p.to);m.position.copy(A).add(B).multiplyScalar(.5);m.quaternion.setFromUnitVectors(V([0,1,0]),B.sub(A).normalize())}
 else if(p.pos){m.position.set(...p.pos);m.rotation.set(...p.rot.map(d=>d*Math.PI/180))}
 if(p.scale)m.scale.set(...p.scale);
 if(p.edges)m.add(new THREE.LineSegments(new THREE.EdgesGeometry(geo),new THREE.LineBasicMaterial({color:0x5b7686})));
 return m}
D.components.forEach(c=>{const g=new THREE.Group();g.userData.ex=V(c.explode);comps[c.id]=c;groups[c.id]=g;
 c.parts.forEach(p=>{const m=build(p);m.userData.id=c.id;g.add(m)});S.add(g)});

// daftar komponen
const rows=$('rows');
D.components.forEach(c=>{const r=document.createElement('div');r.className='row';r.dataset.id=c.id;
 r.innerHTML='<span class="n">'+c.id+'</span><span>'+c.name+'</span><span class="pr">'+c.price_rp.toLocaleString('id-ID')+'</span><div class="det"><i>'+c.spec+'</i>'+c.function+'</div>';
 r.onmouseenter=()=>{hoverId=c.id;hl()};r.onmouseleave=()=>{hoverId=0;hl()};r.onclick=()=>select(c.id);rows.appendChild(r)});
$('tot').innerHTML='Total komponen <b>'+fmt(D.total_bom_rp)+'</b><br>Anggaran per unit <b>'+fmt(D.total_with_contingency_rp)+'</b> ('+D.contingency_note.replace(/^dibulatkan Rp 2\.500\.000\/unit /,'')+')';

// sorotan & pilihan
let hoverId=0,selId=0,exp=false,tipOn=false;
function hl(){for(const id in groups){const on=(+id==hoverId||+id==selId);groups[id].traverse(o=>{if(o.isMesh){o.material.emissive.setHex(on?0x2255ff:0);o.material.emissiveIntensity=.7}})}
 [...rows.children].forEach(r=>r.classList.toggle('sel',+r.dataset.id==selId))}
const tg=V([0,-.2,0]),tgT=tg.clone();let th=.7,ph=1.35,rad=3.8,radT=3.8,auto=true;
function select(id){selId=id==selId?0:id;hl();if(!selId)return;
 const b=new THREE.Box3().setFromObject(groups[selId]),c=b.getCenter(new THREE.Vector3()),z=b.getSize(new THREE.Vector3()).length();
 tgT.copy(c);radT=clamp(z*2.8+.5,.9,5);
 const r=rows.querySelector('.row.sel');if(r)r.scrollIntoView({block:'nearest'})}
$('br').onclick=()=>{tgT.set(0,exp?-.1:-.2,0);radT=exp?5.2:3.8;selId=0;hl()};
$('bx').onclick=()=>{exp=!exp;$('bx').classList.toggle('on',exp);$('bx').textContent=exp?'Gabungkan':'Mode terurai';env.visible=!exp;$('br').onclick()};

// tooltip & picking
const rc=new THREE.Raycaster(),mv=new THREE.Vector2(),tip=$('tip'),INNER=[2,3,4,6];
const vis=o=>{for(;o;o=o.parent)if(!o.visible)return false;return true};
function pickId(x,y){mv.set(x/innerWidth*2-1,-y/innerHeight*2+1);rc.setFromCamera(mv,cam);
 const hs=rc.intersectObjects(S.children,true).filter(h=>h.object.userData.id&&vis(h.object));if(!hs.length)return 0;
 const f=hs[0];if(f.object.userData.id==15){const i=hs.find(h=>INNER.includes(h.object.userData.id)&&h.distance-f.distance<.3);if(i)return i.object.userData.id}
 return f.object.userData.id}
function hideTip(){tip.style.display='none';tipOn=false;cv.style.cursor=''}
function showTip(id,x,y){if(!id){hideTip();return}const c=comps[id];
 tip.innerHTML='<b>#'+c.id+' '+c.name+'</b><span class="p">'+fmt(c.price_rp)+'</span><i>'+c.spec+'</i>'+c.function;tip.style.display='block';
 const w=tip.offsetWidth,h=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(x+14,innerWidth-w-8))+'px';
 tip.style.top=(y+18+h>innerHeight-8?Math.max(8,y-h-12):y+18)+'px';tipOn=true;cv.style.cursor='pointer'}

// kontrol kamera
const ptr=new Map();let pd=0,dn=null,moved=false,multi=false;
const dist=()=>{const v=[...ptr.values()];return Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1])};
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,[e.clientX,e.clientY]);auto=false;hideTip();
 if(ptr.size==1){dn=[e.clientX,e.clientY];moved=false;multi=false}else{multi=true;pd=dist()}});
cv.addEventListener('pointermove',e=>{
 if(e.pointerType==='mouse'&&e.buttons===0){const id=pickId(e.clientX,e.clientY);if(id!=hoverId){hoverId=id;hl()}showTip(id,e.clientX,e.clientY);return}
 const o=ptr.get(e.pointerId);if(!o)return;if(dn&&Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>6)moved=true;
 if(ptr.size==1){th-=(e.clientX-o[0])*.007;ph=clamp(ph-(e.clientY-o[1])*.005,.4,2.1)}
 ptr.set(e.pointerId,[e.clientX,e.clientY]);if(ptr.size==2){const d=dist();radT=clamp(radT*pd/d,.7,6.5);pd=d}});
cv.addEventListener('pointerup',e=>{if(ptr.size==1&&!moved&&!multi){const id=pickId(e.clientX,e.clientY);if(id){select(id);showTip(id,e.clientX,e.clientY)}else if(selId)select(selId)}ptr.delete(e.pointerId)});
cv.addEventListener('pointercancel',e=>ptr.delete(e.pointerId));
cv.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){hideTip();if(hoverId){hoverId=0;hl()}}});

(async()=>{try{DL=window.claude&&await claude.use('downloads')}catch(e){}if(DL)$('dl').hidden=false})();

 tg.lerp(tgT,k);rad+=(radT-rad)*k;if(auto&&!tipOn&&!selId)th+=dt*.15;

var k;requestAnimationFrame(frame);
