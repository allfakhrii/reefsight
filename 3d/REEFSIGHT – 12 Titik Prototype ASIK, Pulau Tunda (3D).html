<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--panel:rgba(255,255,255,.92);--ink:#10222b;--mut:#4a6270;--line:#d3e0e7;--acc:#E52B16;--btn:#fff;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:rgba(9,22,31,.9);--ink:#e8f4f8;--mut:#9db7c4;--line:#27404e;--acc:#FF7900;--btn:#12303f;color-scheme:dark}}
:root[data-theme="dark"]{--panel:rgba(9,22,31,.9);--ink:#e8f4f8;--mut:#9db7c4;--line:#27404e;--acc:#FF7900;--btn:#12303f;color-scheme:dark}
html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:#bfe6f6;color:var(--ink)}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#list{position:fixed;left:12px;top:calc(env(safe-area-inset-top,0px) + 12px);width:min(320px,calc(100vw - 24px));max-height:calc(100% - 130px - env(safe-area-inset-top,0px));display:flex;flex-direction:column;background:var(--panel);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);backdrop-filter:blur(6px);overflow:hidden}
#lh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line)}
#lh small,.row small{font-weight:500;color:var(--mut)}
#rows{overflow:auto;flex:1}
.row{display:grid;grid-template-columns:22px 1fr auto;gap:6px;padding:7px 14px;font-size:13px;border-bottom:1px solid var(--line);cursor:pointer;align-items:baseline}
.row:hover,.row.sel{background:rgba(229,43,22,.1)}.row .n{color:var(--mut)}.row b{font-variant-numeric:tabular-nums}
.det{display:none;grid-column:1/-1;font-size:12px;line-height:1.5;color:var(--mut)}.row.sel .det{display:block}
#tot{padding:9px 14px;font-size:12px;line-height:1.45;border-top:1px solid var(--line)}
#list.min #rows,#list.min #tot{display:none}
#hint{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);font-size:11px;color:#244a5c;text-align:right;max-width:210px;background:rgba(255,255,255,.55);padding:4px 8px;border-radius:8px}
#cp{position:fixed;right:14px;top:calc(env(safe-area-inset-top,0px) + 64px);width:46px;height:46px;border-radius:50%;background:var(--panel);box-shadow:0 2px 8px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink)}
#ca{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding-top:3px}#ca i{width:0;height:0;border:5px solid transparent;border-bottom:12px solid #d33;border-top:0}
#note{position:fixed;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);font-size:10px;color:#244a5c;max-width:230px;text-align:right;background:rgba(255,255,255,.55);padding:4px 8px;border-radius:8px}
#btns{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:calc(100vw - 20px)}
#btns button{border:1px solid var(--line);background:var(--btn);color:var(--ink);font:600 13px system-ui,sans-serif;padding:9px 13px;border-radius:10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#btns button.on{border-color:var(--acc);box-shadow:0 0 0 2px rgba(229,43,22,.35)}
#tip{position:fixed;display:none;z-index:5;max-width:270px;pointer-events:none;background:var(--panel);border-radius:10px;padding:9px 11px;font-size:12px;line-height:1.5;box-shadow:0 4px 14px rgba(0,0,0,.35);border:1px solid var(--line)}
#tip b{display:block;font-size:13px}#tip .p{display:block;color:var(--acc);font-weight:700;font-size:14px;margin:1px 0 2px;font-variant-numeric:tabular-nums}
@media(max-width:700px){#note{display:none}}

#sp{position:fixed;right:12px;top:calc(env(safe-area-inset-top,0px) + 120px);width:min(340px,calc(100vw - 24px));max-height:calc(100% - 190px - env(safe-area-inset-top,0px));display:none;flex-direction:column;background:var(--panel);border-radius:14px;box-shadow:0 4px 18px rgba(0,0,0,.25);backdrop-filter:blur(6px);overflow:hidden}
#sh0{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;background:#0F3445;color:#fff;font-size:13px}#sh0 small{opacity:.75}#sx{background:none;border:0;color:#fff;font-size:18px;cursor:pointer}
#stabs{display:flex;flex-wrap:wrap;border-bottom:1px solid var(--line)}#stabs button{flex:1;border:0;background:none;color:var(--mut);font:600 11px system-ui,sans-serif;padding:8px 4px;cursor:pointer;border-bottom:2px solid transparent}
#stabs button.on{color:var(--acc);border-bottom-color:var(--acc)}
#sb{overflow:auto;padding:10px 12px;font-size:12px;line-height:1.5}#sb table{width:100%;border-collapse:collapse;margin:6px 0}#sb td{padding:3px 0;vertical-align:top;border-bottom:1px solid var(--line)}#sb td:first-child{color:var(--mut);width:42%;padding-right:6px}
.bd{display:inline-block;background:#FF7900;color:#fff;font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;margin:0 4px 2px 0}
.nr{background:rgba(229,43,22,.08);border-left:3px solid var(--acc);padding:6px 8px;margin:8px 0;border-radius:0 6px 6px 0}.nt{color:var(--mut);margin:6px 0}
.pri{width:100%;border:0;background:var(--acc);color:#fff;font:700 13px system-ui,sans-serif;padding:10px;border-radius:8px;cursor:pointer;margin-top:4px}
.dr{padding:6px 8px;border:1px solid var(--line);border-radius:8px;margin:4px 0;cursor:pointer}.dr.on,.dr:hover,.gd:hover{background:rgba(229,43,22,.08)}.dr small{display:block;color:var(--mut)}.gd{cursor:pointer}#dc{width:100%;border-radius:8px;margin:6px 0}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}.ti{position:relative;padding:0 0 10px}.ti i{position:absolute;left:-19px;top:3px;width:10px;height:10px;border-radius:50%}
#tip .bd{margin-top:3px}
#uh{position:fixed;left:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 62px);background:var(--panel);padding:8px 12px;border-radius:10px;font-size:12px;display:none;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#ubtns{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 12px);display:none;gap:8px;flex-wrap:wrap;justify-content:center;width:calc(100vw - 20px)}
#ubtns button{border:1px solid var(--line);background:var(--btn);color:var(--ink);font:600 13px system-ui,sans-serif;padding:9px 13px;border-radius:10px;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.2)}
body.uw #list,body.uw #hint,body.uw #cp,body.uw #note,body.uw #btns{display:none}body.uw #ubtns{display:flex}body.uw #uh{display:block}body.uw #sp{top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100% - 130px)}
</style>

   if(fg.key=='clown'&&anem.length)c=anem[(rnd()*anem.length)|0];else if(cpos.length&&rnd()<.85)c=cpos[(rnd()*cpos.length)|0];else{const a=rnd()*6.28,d=1+rnd()*5;c=[Math.cos(a)*d,Math.sin(a)*d]}
   for(let q=0;q<gn;q++){const cw=(rnd()*FCW[fg.key].length)|0,g=fishObj(fg.key,cw);g.scale.setScalar((.85+rnd()*.35)*1.5);U.add(g);
    fishes.push({g,cx:c[0],cz:c[1],rx:B.rx*(.7+rnd()*.6),sp:B.sp*(.7+rnd()*.6)*(rnd()<.5?1:-1),ph:rnd()*6.28,ox:(rnd()-.5)*B.sch*2,oz:(rnd()-.5)*B.sch*2,oy:(rnd()-.5)*.25,hy:B.hy*(.7+rnd()*.6),jit:B.jit,init:false,px:0,py:0,pz:0,yaw:0,pit:0})}}})}
function enterUW(i){UWI=i;MODE='uw';document.body.classList.add('uw');hideTip();buildUW(i);uth=uthT=.6;uph=uphT=1.3;urad=uradT=6;utg.set(0,-2.2,0);utgT.copy(utg);uaut=true;upin=false;
 $('uh').innerHTML='<b>'+ST[i].station_id+'</b> · '+ST[i].habitat.type+'<br>'+BADGE('SIMULATED HABITAT')+BADGE('SIMULATED BIODIVERSITY')}
function exitUW(){MODE='map';document.body.classList.remove('uw');hideTip();upin=false;if(cur>=0)spn.style.display='flex'}
$('ub1').onclick=exitUW;$('ub2').onclick=()=>{uthT=.6;uphT=1.3;uradT=6;utgT.set(0,-2.2,0)};$('ub3').onclick=()=>{utgT.set(0,-1.1,0);uradT=3.2};$('ub4').onclick=()=>{if(cur>=0)spn.style.display=spn.style.display==='flex'?'none':'flex'};
function placeTip(h,x,y){tip.innerHTML=h;tip.style.display='block';const w=tip.offsetWidth,hh=tip.offsetHeight;tip.style.left=Math.max(8,Math.min(x+14,innerWidth-w-8))+'px';tip.style.top=(y+18+hh>innerHeight-8?Math.max(8,y-hh-12):y+18)+'px';tipOn=true;cv.style.cursor='pointer'}
function uwTip(o,x,y){const u=o.userData;let h;
 if(u.kind=='fish'){const c=CAT.fish_groups[u.key];h='<b>'+c.common+'</b><span class="p">'+c.family+'</span>Kelompok taksonomi: '+c.taxon_group+'<br>Contoh: '+c.genera[Math.min(u.cw,c.genera.length-1)]+'<br>'+c.note+'<br>'+BADGE('SIMULATED BIODIVERSITY')+'<br><small>Status identifikasi: kandidat visualisasi, belum terverifikasi di stasiun ini</small>'}
 else if(u.kind=='coral'){const c=CAT.coral_forms[u.form];h='<b>'+u.form+'</b><span class="p">Bentuk pertumbuhan karang</span>'+c.description+'<br>'+BADGE('SIMULATED BIODIVERSITY')+'<br><small>Status identifikasi: simulasi bentuk pertumbuhan, bukan identifikasi spesies</small>'}
 else h='<b>Prototype '+ST[UWI].prototype_id+'</b><span class="p">EchoVision (model simulasi)</span>Float, menara sensor, kamera optik, sonar, dan mooring. Ukuran diperbesar ±1,5× pada tampilan.<br>'+BADGE('SIMULATED');
 placeTip(h,x,y)}
const urc=new THREE.Raycaster(),umv=new THREE.Vector2(),upt=new Map();let umoved=false,udn=null,upd=0,upin=false,umulti=false;
const uHit=(x,y)=>{umv.set(x/innerWidth*2-1,-y/innerHeight*2+1);urc.setFromCamera(umv,ucam);const h=urc.intersectObjects(uPick,false)[0];return h?h.object:null},ud=()=>{const v=[...upt.values()];return Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1])};
cv.addEventListener('pointerdown',e=>{if(MODE!=='uw')return;cv.setPointerCapture(e.pointerId);upt.set(e.pointerId,[e.clientX,e.clientY]);uaut=false;hideTip();upin=false;if(upt.size==1){udn=[e.clientX,e.clientY];umoved=false;umulti=false}else{umulti=true;upd=ud()}});
cv.addEventListener('pointermove',e=>{if(MODE!=='uw')return;
 if(e.pointerType==='mouse'&&e.buttons===0){if(upin)return;const o=uHit(e.clientX,e.clientY);if(o)uwTip(o,e.clientX,e.clientY);else hideTip();return}
 const o=upt.get(e.pointerId);if(!o)return;if(udn&&Math.hypot(e.clientX-udn[0],e.clientY-udn[1])>6)umoved=true;
 if(upt.size==1){uthT-=(e.clientX-o[0])*.007;uphT=clamp(uphT-(e.clientY-o[1])*.005,.5,1.75)}upt.set(e.pointerId,[e.clientX,e.clientY]);if(upt.size==2){const d=ud();uradT=clamp(uradT*upd/d,1.2,12);upd=d}});
cv.addEventListener('pointerup',e=>{if(MODE!=='uw')return;if(upt.size==1&&!umoved&&!umulti){const o=uHit(e.clientX,e.clientY);if(o){upin=true;uwTip(o,e.clientX,e.clientY)}else{upin=false;hideTip()}}upt.delete(e.pointerId)});
cv.addEventListener('wheel',e=>{if(MODE!=='uw')return;e.preventDefault();uradT=clamp(uradT*(1+e.deltaY*.001),1.2,12);uaut=false},{passive:false});
addEventListener('resize',()=>{ucam.aspect=innerWidth/innerHeight;ucam.updateProjectionMatrix()});ucam.aspect=innerWidth/innerHeight;ucam.updateProjectionMatrix();
function uwFrame(dt){const k=1-Math.exp(-dt*4);if(uaut&&!tipOn)uthT+=dt*.07;uth+=(uthT-uth)*k;uph+=(uphT-uph)*k;urad+=(uradT-urad)*k;utg.lerp(utgT,k);
 const x=utg.x+urad*Math.sin(uph)*Math.sin(uth),z=utg.z+urad*Math.sin(uph)*Math.cos(uth);ucam.position.set(x,clamp(utg.y+urad*Math.cos(uph),HF(x,z)+.4,-.4),z);ucam.lookAt(utg);
 fishes.forEach(f=>{const a=f.ph+T*f.sp,fx=f.cx+f.rx*Math.cos(a)+f.ox+f.jit*Math.sin(T*3.1+f.ph*2),fz=f.cz+f.rx*.8*Math.sin(a)+f.oz+f.jit*Math.cos(T*2.7+f.ph),h0=HF(fx,fz),fy=Math.max(h0+f.hy+f.oy+.15*Math.sin(T*.8+f.ph),h0+.12);
  if(f.init){const dx=fx-f.px,dz=fz-f.pz,sp=Math.hypot(dx,dz);if(sp>1e-5){f.yaw=-Math.atan2(dz,dx);f.pit=Math.atan2(fy-f.py,sp)*.6}}
  f.px=fx;f.py=fy;f.pz=fz;f.init=true;f.g.position.set(fx,fy,fz);f.g.rotation.set(0,f.yaw+.12*Math.sin(T*9*Math.abs(f.sp)+f.ph),f.pit)});
 R.render(U,ucam)}
